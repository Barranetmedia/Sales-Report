<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Pengiriman — Booster & Nutritan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #101815;
    --bg-elev: #17211D;
    --card: #1C2721;
    --card-hover: #223229;
    --line: #2C3A33;
    --text: #ECF1EC;
    --text-mute: #8FA398;
    --text-dim: #5E7268;
    --booster: #6FCF7C;
    --booster-dim: #3A5C40;
    --nutritan: #F2A65A;
    --nutritan-dim: #6B4D2C;
    --ok: #4CAF6D;
    --bad: #E2585A;
    --warn: #E0B84C;
    --neutral: #6B7680;
    --radius: 14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #1A2620 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 32px 24px 80px;
  }
  .wrap{ max-width: 1180px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap: wrap; gap: 20px;
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .brand-title{
    font-family:'IBM Plex Sans Condensed', sans-serif;
    font-weight:700;
    font-size: 26px;
    letter-spacing: -0.02em;
  }
  .brand-title span{ color: var(--text-mute); font-weight: 500; }
  .subtitle{ color: var(--text-mute); font-size: 13px; margin-top: 6px; }

  .filter-group{
    display:flex; gap:6px; background: var(--bg-elev);
    padding:4px; border-radius: 999px; border:1px solid var(--line);
  }
  .filter-btn{
    border:none; background:transparent; color: var(--text-mute);
    font-family:'IBM Plex Sans'; font-size:13px; font-weight:600;
    padding:8px 16px; border-radius:999px; cursor:pointer;
    transition: all .18s ease;
  }
  .filter-btn.active[data-brand="ALL"]{ background:#3B4A42; color:var(--text); }
  .filter-btn.active[data-brand="B"]{ background: var(--booster); color:#0E1810; }
  .filter-btn.active[data-brand="N"]{ background: var(--nutritan); color:#241605; }

  /* ---------- Breadcrumb ---------- */
  .crumbs{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color: var(--text-mute);
    margin-bottom: 22px; font-weight:500;
  }
  .crumbs .seg{ cursor:pointer; padding:5px 10px; border-radius:8px; transition: background .15s; }
  .crumbs .seg:hover{ background: var(--bg-elev); color: var(--text); }
  .crumbs .seg.current{ color: var(--text); background: var(--card); border:1px solid var(--line); }
  .crumbs .sep{ color: var(--text-dim); }

  /* ---------- KPI cards ---------- */
  .kpi-row{
    display:grid; grid-template-columns: repeat(5, 1fr); gap:14px;
    margin-bottom: 26px;
  }
  .kpi{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
    padding: 18px 18px 16px;
    position:relative; overflow:hidden;
  }
  .kpi .label{ font-size:11.5px; color:var(--text-mute); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .kpi .value{ font-family:'IBM Plex Mono'; font-size:22px; font-weight:600; margin-top:8px; letter-spacing:-0.01em; }
  .kpi .sub{ font-size:11.5px; color: var(--text-dim); margin-top:4px; font-family:'IBM Plex Mono'; }
  .kpi.margin .value{ color: var(--booster); }
  .kpi.delivered .value{ color: var(--ok); }
  .kpi.retur .value{ color: var(--bad); }

  /* ---------- bottle gauge signature ---------- */
  .gauge-row{
    display:grid; grid-template-columns: 1fr 1fr; gap:14px;
    margin-bottom: 26px;
  }
  .gauge-card{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
    padding: 20px 22px; display:flex; align-items:center; gap:20px;
  }
  .gauge-card.booster{ border-color: var(--booster-dim); }
  .gauge-card.nutritan{ border-color: var(--nutritan-dim); }
  .bottle{ width:34px; height:64px; border:2px solid var(--line); border-radius: 6px 6px 10px 10px;
    position:relative; flex-shrink:0; background: #0E1712; overflow:hidden; }
  .bottle::before{ content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:12px; height:8px; background:var(--line); border-radius:2px 2px 0 0; }
  .bottle .fill{ position:absolute; bottom:0; left:0; width:100%; transition: height .6s cubic-bezier(.4,0,.2,1); }
  .gauge-card.booster .fill{ background: linear-gradient(180deg, #8FE39B, var(--booster)); }
  .gauge-card.nutritan .fill{ background: linear-gradient(180deg, #F7C084, var(--nutritan)); }
  .gauge-info{ flex:1; }
  .gauge-info .name{ font-family:'IBM Plex Sans Condensed'; font-weight:600; font-size:15px; }
  .gauge-card.booster .name{ color: var(--booster); }
  .gauge-card.nutritan .name{ color: var(--nutritan); }
  .gauge-info .pct{ font-family:'IBM Plex Mono'; font-size:26px; font-weight:600; margin-top:2px; }
  .gauge-info .desc{ font-size:11.5px; color: var(--text-mute); margin-top:2px; }

  /* ---------- chart card ---------- */
  .panel{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
    padding: 20px 22px; margin-bottom: 22px;
  }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .panel-title{ font-family:'IBM Plex Sans Condensed'; font-weight:600; font-size:15px; }
  .panel-title .accent{ color: var(--text-mute); font-weight:500; font-size:12.5px; }
  .chart-wrap{ height: 260px; }

  /* ---------- grid cards (year->month, month->day) ---------- */
  .cards-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:12px;
  }
  .period-card{
    background: var(--bg-elev); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; cursor:pointer; transition: all .15s ease;
    position:relative;
  }
  .period-card:hover{ background: var(--card-hover); border-color:#3B4A42; transform: translateY(-2px); }
  .period-card .p-label{ font-family:'IBM Plex Sans Condensed'; font-weight:600; font-size:14px; }
  .period-card .p-omset{ font-family:'IBM Plex Mono'; font-size:15px; margin-top:8px; color: var(--text); }
  .period-card .p-meta{ font-size:11px; color: var(--text-mute); margin-top:4px; }
  .period-card .p-bar{ height:4px; border-radius:2px; background: var(--line); margin-top:10px; overflow:hidden; display:flex; }
  .period-card .p-bar .b{ background: var(--booster); }
  .period-card .p-bar .n{ background: var(--nutritan); }

  /* ---------- daily table ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:right; font-weight:600; color: var(--text-mute); font-size:11px;
    text-transform:uppercase; letter-spacing:.03em; padding: 8px 10px; border-bottom:1px solid var(--line);
  }
  thead th:first-child, tbody td:first-child{ text-align:left; }
  tbody td{ padding:10px 10px; text-align:right; font-family:'IBM Plex Mono'; font-size:12.5px; border-bottom:1px solid #1F2B25; }
  tbody tr:hover{ background: var(--bg-elev); }
  .tag{ display:inline-block; padding:2px 8px; border-radius:6px; font-size:10.5px; font-weight:700; font-family:'IBM Plex Sans'; }
  .tag.b{ background: var(--booster-dim); color: var(--booster); }
  .tag.n{ background: var(--nutritan-dim); color: var(--nutritan); }

  .empty{ text-align:center; padding:40px; color: var(--text-dim); font-size:13px; }

  @media (max-width: 880px){
    .kpi-row{ grid-template-columns: repeat(2,1fr); }
    .gauge-row{ grid-template-columns: 1fr; }
  }
  @media (max-width: 520px){
    .kpi-row{ grid-template-columns: 1fr 1fr; }
    header{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand-title">Laporan Pengiriman <span>· Booster & Nutritan</span></div>
      <div class="subtitle" id="dateRangeLabel">Data historis — akan tersambung ke Google Sheets via Apps Script</div>
    </div>
    <div class="filter-group" id="brandFilter">
      <button class="filter-btn active" data-brand="ALL">Semua</button>
      <button class="filter-btn" data-brand="B">Booster</button>
      <button class="filter-btn" data-brand="N">Nutritan</button>
    </div>
  </header>

  <div class="crumbs" id="crumbs"></div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="gauge-row" id="gaugeRow"></div>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">Tren Omset <span class="accent" id="chartSub">per bulan</span></div>
    </div>
    <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
  </div>

  <div class="panel" id="drillPanel">
    <div class="panel-head">
      <div class="panel-title" id="drillTitle">Pilih bulan</div>
    </div>
    <div id="drillBody"></div>
  </div>

</div>

<div id="loadingState" style="text-align:center; padding:60px 20px; color:var(--text-mute); font-family:'IBM Plex Mono'; font-size:13px;">
  Mengambil data dari Google Sheets…
</div>
<div id="errorState" style="display:none; text-align:center; padding:60px 20px; color:var(--bad); font-family:'IBM Plex Sans'; font-size:14px;"></div>

<script>
// ---------- Config ----------
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxpDWnAgQV8xi_PEYZy_I3DeSX3p8xjQ6IMdk1iTWdLPxYAWViYMb69pyj-NTpVza-s4w/exec';

// ---------- State ----------
let level = 'YEAR';     // YEAR | MONTH | DAY-LIST(within month)
let currentYear = null;
let currentMonth = null; // 1-12
let brandFilter = 'ALL';
let RAW_DAILY = {};
let allDates = [];
let years = [];

const MONTH_ID = ["", "Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const MONTH_FULL = ["", "Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const IDR = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const NUM = n => Math.round(n).toLocaleString('id-ID');

// map API's Grup Produk text to internal short codes used throughout the UI
const BRAND_MAP = { 'Booster 76': 'B', 'Nutritan': 'N' };

function toDateKey(v){
  // Apps Script returns dates as ISO strings (UTC) when JSON-serialized.
  // The underlying Date was originally a WIB (UTC+7) local date, so we
  // shift it back by 7 hours before reading the date components — otherwise
  // e.g. "2026-03-01 00:00 WIB" (stored as "2026-02-28T17:00:00.000Z")
  // would incorrectly read as 28 Feb instead of 1 Mar.
  if(!v) return null;
  const d = new Date(v);
  if(isNaN(d)) return null;
  const wib = new Date(d.getTime() + 7 * 60 * 60 * 1000);
  return wib.toISOString().slice(0,10);
}

function emptyMetrics(){
  return {qty:0, omset:0, eksp:0, hpp:0, codtf:0, delivered:0, retur:0, ongoing:0, hilang:0,
          klaimHilang:0, biayaRetur:0, klaimRetur:0};
}

function buildDailyFromRows(rows){
  const daily = {};
  rows.forEach(r => {
    const dateKey = toDateKey(r.closingDate);
    const brand = BRAND_MAP[r.grupProduk];
    if(!dateKey || !brand) return; // skip rows we can't classify
    if(!daily[dateKey]) daily[dateKey] = { B: emptyMetrics(), N: emptyMetrics() };
    const m = daily[dateKey][brand];
    m.qty += Number(r.qty)||0;
    m.omset += Number(r.omset)||0;
    m.eksp += Number(r.biayaEkspedisi)||0;
    m.hpp += Number(r.hpp)||0;
    m.codtf += (Number(r.cod)||0) + (Number(r.transfer)||0);
    // reserved for future display — tracked now so no re-fetch is needed later
    m.klaimHilang += Number(r.klaimHilang)||0;
    m.biayaRetur += Number(r.biayaRetur)||0;
    m.klaimRetur += Number(r.klaimRetur)||0;
    if(r.status === 'Delivered') m.delivered += 1;
    else if(r.status === 'Retur') m.retur += 1;
    else if(r.status === 'On-going') m.ongoing += 1;
    else if(r.status === 'Hilang') m.hilang += 1;
  });
  return daily;
}


async function loadData(){
  try{
    const res = await fetch(APPS_SCRIPT_URL);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    if(!Array.isArray(rows)) throw new Error('Format data tidak sesuai (bukan array)');

    RAW_DAILY = buildDailyFromRows(rows);
    allDates = Object.keys(RAW_DAILY).sort();
    if(allDates.length === 0) throw new Error('Data kosong — cek Grup Produk terisi "Booster 76" atau "Nutritan"');
    years = [...new Set(allDates.map(d => d.slice(0,4)))];
    currentYear = years[years.length-1];

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('dateRangeLabel').textContent =
      `Data live dari Google Sheets · ${allDates[0]} s/d ${allDates[allDates.length-1]}`;
    render();
  }catch(err){
    document.getElementById('loadingState').style.display = 'none';
    const errEl = document.getElementById('errorState');
    errEl.style.display = 'block';
    errEl.innerHTML = `Gagal mengambil data dari Apps Script.<br><span style="color:var(--text-dim); font-size:12px;">${err.message}</span><br><br>
      <button onclick="loadData()" style="margin-top:8px; padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font-family:'IBM Plex Sans';">Coba lagi</button>`;
    console.error(err);
  }
}

function addMetrics(a,b){
  for(const k in a) a[k]+=b[k]||0;
}
function combineBrands(dayObj){
  // returns metrics according to brandFilter
  if(brandFilter==='ALL'){
    const m = emptyMetrics();
    addMetrics(m, dayObj.B); addMetrics(m, dayObj.N);
    return m;
  }
  return dayObj[brandFilter] || emptyMetrics();
}

function marginOf(m){ return m.omset - m.eksp - m.hpp; }
function pct(a,b){ return b>0 ? (a/b*100) : 0; }

// ---------- Aggregations ----------
function monthsOfYear(year){
  return [...new Set(allDates.filter(d=>d.startsWith(year)).map(d=>d.slice(5,7)))].sort();
}
function daysOfMonth(year, month){
  return allDates.filter(d=>d.startsWith(year+'-'+month)).sort();
}
function aggregateDates(dateList){
  const m = emptyMetrics();
  dateList.forEach(d=>addMetrics(m, combineBrands(RAW_DAILY[d])));
  return m;
}
function aggregateBrandFor(dateList, brand){
  const m = emptyMetrics();
  dateList.forEach(d=>addMetrics(m, RAW_DAILY[d][brand] || emptyMetrics()));
  return m;
}

// ---------- Renderers ----------
function renderCrumbs(){
  const el = document.getElementById('crumbs');
  let html = `<span class="seg ${level==='YEAR'?'current':''}" onclick="goYear()">Tahun ${currentYear}</span>`;
  if(level==='MONTH' || level==='DAY-LIST'){
    html += `<span class="sep">/</span><span class="seg ${level==='MONTH'?'current':''}" onclick="goMonthList()">Bulanan</span>`;
  }
  if(level==='DAY-LIST'){
    html += `<span class="sep">/</span><span class="seg current">${MONTH_FULL[parseInt(currentMonth)]} ${currentYear}</span>`;
  }
  el.innerHTML = html;
}

function renderKpis(metrics, contextLabel){
  const el = document.getElementById('kpiRow');
  const margin = marginOf(metrics);
  const totalStatus = metrics.delivered+metrics.retur+metrics.ongoing+metrics.hilang;
  el.innerHTML = `
    <div class="kpi"><div class="label">Qty Terjual</div><div class="value">${NUM(metrics.qty)}</div><div class="sub">${contextLabel}</div></div>
    <div class="kpi"><div class="label">Omset</div><div class="value">${IDR(metrics.omset)}</div><div class="sub">COD/TF ${IDR(metrics.codtf)}</div></div>
    <div class="kpi margin"><div class="label">Est. Margin</div><div class="value">${IDR(margin)}</div><div class="sub">Eksp ${IDR(metrics.eksp)} · HPP ${IDR(metrics.hpp)}</div></div>
    <div class="kpi delivered"><div class="label">Delivered</div><div class="value">${pct(metrics.delivered,totalStatus).toFixed(1)}%</div><div class="sub">${NUM(metrics.delivered)} paket</div></div>
    <div class="kpi retur"><div class="label">Retur</div><div class="value">${pct(metrics.retur,totalStatus).toFixed(1)}%</div><div class="sub">${NUM(metrics.retur)} paket</div></div>
  `;
}

function renderGauges(dateList){
  const el = document.getElementById('gaugeRow');
  const bm = aggregateBrandFor(dateList, 'B');
  const nm = aggregateBrandFor(dateList, 'N');
  const bTotal = bm.delivered+bm.retur+bm.ongoing+bm.hilang;
  const nTotal = nm.delivered+nm.retur+nm.ongoing+nm.hilang;
  const bPct = pct(bm.delivered, bTotal);
  const nPct = pct(nm.delivered, nTotal);
  el.innerHTML = `
    <div class="gauge-card booster">
      <div class="bottle"><div class="fill" style="height:${bPct}%"></div></div>
      <div class="gauge-info">
        <div class="name">BOOSTER</div>
        <div class="pct">${bPct.toFixed(1)}%</div>
        <div class="desc">tingkat delivered dari ${NUM(bTotal)} paket · omset ${IDR(bm.omset)}</div>
      </div>
    </div>
    <div class="gauge-card nutritan">
      <div class="bottle"><div class="fill" style="height:${nPct}%"></div></div>
      <div class="gauge-info">
        <div class="name">NUTRITAN</div>
        <div class="pct">${nPct.toFixed(1)}%</div>
        <div class="desc">tingkat delivered dari ${NUM(nTotal)} paket · omset ${IDR(nm.omset)}</div>
      </div>
    </div>
  `;
}

let chartInstance = null;
function renderChart(labels, values, subLabel){
  document.getElementById('chartSub').textContent = subLabel;
  const ctx = document.getElementById('trendChart').getContext('2d');
  if(chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: brandFilter==='N' ? '#F2A65A' : '#6FCF7C',
        borderRadius: 6,
        maxBarThickness: 42,
      }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label: (c)=> IDR(c.raw) } } },
      scales:{
        x:{ grid:{display:false}, ticks:{ color:'#8FA398', font:{family:'IBM Plex Mono', size:11} } },
        y:{ grid:{color:'#22302A'}, ticks:{ color:'#8FA398', font:{family:'IBM Plex Mono', size:10},
            callback: v => (v/1000000).toFixed(1)+'jt' } }
      }
    }
  });
}

function renderDrillYear(){
  document.getElementById('drillTitle').textContent = 'Bulanan';
  const months = monthsOfYear(currentYear);
  const el = document.getElementById('drillBody');
  let html = '<div class="cards-grid">';
  months.forEach(mo=>{
    const dates = daysOfMonth(currentYear, mo);
    const m = aggregateDates(dates);
    const bm = aggregateBrandFor(dates,'B'), nm = aggregateBrandFor(dates,'N');
    const totalOmset = bm.omset+nm.omset;
    const bShare = totalOmset>0 ? (bm.omset/totalOmset*100):0;
    html += `<div class="period-card" onclick="goMonth('${mo}')">
      <div class="p-label">${MONTH_ID[parseInt(mo)]} ${currentYear}</div>
      <div class="p-omset">${IDR(m.omset)}</div>
      <div class="p-meta">${NUM(m.qty)} pcs terjual</div>
      <div class="p-bar"><div class="b" style="width:${bShare}%"></div><div class="n" style="width:${100-bShare}%"></div></div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function renderDrillMonth(){
  document.getElementById('drillTitle').textContent = `Harian — ${MONTH_FULL[parseInt(currentMonth)]} ${currentYear}`;
  const dates = daysOfMonth(currentYear, currentMonth);
  const el = document.getElementById('drillBody');
  let rows = '';
  dates.forEach(d=>{
    const m = combineBrands(RAW_DAILY[d]);
    const day = d.slice(8,10);
    const totalStatus = m.delivered+m.retur+m.ongoing+m.hilang;
    rows += `<tr>
      <td>${day} ${MONTH_ID[parseInt(currentMonth)]}</td>
      <td>${NUM(m.qty)}</td>
      <td>${IDR(m.omset)}</td>
      <td>${IDR(m.eksp)}</td>
      <td>${IDR(marginOf(m))}</td>
      <td>${NUM(m.delivered)}</td>
      <td>${NUM(m.retur)}</td>
      <td>${pct(m.delivered,totalStatus).toFixed(0)}%</td>
    </tr>`;
  });
  el.innerHTML = `<table>
    <thead><tr><th>Tanggal</th><th>Qty</th><th>Omset</th><th>Eksp.</th><th>Margin</th><th>Delvd</th><th>Retur</th><th>% Del</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="8" class="empty">Tidak ada data</td></tr>'}</tbody>
  </table>`;
}

function render(){
  renderCrumbs();
  if(level==='YEAR' || level==='MONTH'){
    const dates = allDates.filter(d=>d.startsWith(currentYear));
    renderKpis(aggregateDates(dates), `Tahun ${currentYear}`);
    renderGauges(dates);
    const months = monthsOfYear(currentYear);
    const labels = months.map(mo=>MONTH_ID[parseInt(mo)]);
    const vals = months.map(mo=> aggregateDates(daysOfMonth(currentYear,mo)).omset );
    renderChart(labels, vals, 'per bulan, tahun '+currentYear);
    renderDrillYear();
  } else if(level==='DAY-LIST'){
    const dates = daysOfMonth(currentYear, currentMonth);
    renderKpis(aggregateDates(dates), `${MONTH_FULL[parseInt(currentMonth)]} ${currentYear}`);
    renderGauges(dates);
    const labels = dates.map(d=>d.slice(8,10));
    const vals = dates.map(d=> combineBrands(RAW_DAILY[d]).omset );
    renderChart(labels, vals, 'per hari, '+MONTH_FULL[parseInt(currentMonth)]+' '+currentYear);
    renderDrillMonth();
  }
}

function goYear(){ level='YEAR'; render(); }
function goMonthList(){ level='YEAR'; render(); }
function goMonth(mo){ currentMonth=mo; level='DAY-LIST'; render(); }

document.getElementById('brandFilter').addEventListener('click', (e)=>{
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  brandFilter = btn.dataset.brand;
  render();
});

loadData();
</script>
